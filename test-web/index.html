<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoRemote Tunnel Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
.card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 48px; max-width: 520px; width: 90%; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
.logo { font-size: 48px; margin-bottom: 16px; }
h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
.subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 32px; }
.status { display: inline-flex; align-items: center; gap: 8px; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); border-radius: 100px; padding: 8px 20px; font-size: 13px; margin-bottom: 32px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.info { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 20px; text-align: left; font-size: 13px; }
.info-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.info-item:last-child { border-bottom: none; }
.label { color: rgba(255,255,255,0.4); }
.value { color: rgba(255,255,255,0.9); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }
.footer { margin-top: 24px; font-size: 12px; color: rgba(255,255,255,0.3); }
</style>
</head>
<body>
<div class="card">
<div class="logo">🚀</div>
<h1>GoRemote Tunnel</h1>
<p class="subtitle">SSH 隧道直通测试 — TLS 加密传输</p>
<div class="status"><span class="dot"></span> Tunnel Active</div>
<div class="info">
<div class="info-item"><span class="label">隧道协议</span><span class="value">WSS + TCP</span></div>
<div class="info-item"><span class="label">加密方式</span><span class="value">TLS 1.3</span></div>
<div class="info-item"><span class="label">本地端口</span><span class="value">7777</span></div>
<div class="info-item"><span class="label">请求路径</span><span class="value" id="path">/</span></div>
<div class="info-item"><span class="label">客户端</span><span class="value">Windows</span></div>
</div>
<p class="footer">GoRemote · 内网穿透测试</p>
</div>
<script>
document.getElementById('path').textContent = window.location.pathname || '/';
</script>
</body>
</html>
