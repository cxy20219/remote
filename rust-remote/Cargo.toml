[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/server",
    "crates/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
http = "1"
http-body-util = "0.1"

rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
tokio-rustls = "0.26"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

aes-gcm = "0.10"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
bcrypt = "0.15"
rand = "0.8"
hex = "0.4"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
proptest = "1"
thiserror = "1"
anyhow = "1"
dashmap = "6"
parking_lot = "0.12"
bytes = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-debug]
inherits = "release"
strip = false
debug = true
