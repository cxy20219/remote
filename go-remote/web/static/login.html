<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoRemote · 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#eff6ff 0%,#e0e7ff 50%,#f0f4ff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:44px;max-width:380px;width:92%;box-shadow:0 4px 24px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04)}
.logo{text-align:center;margin-bottom:8px}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700}
h1{color:#1e293b;font-size:22px;text-align:center;margin-top:16px;margin-bottom:4px}
.subtitle{color:#94a3b8;text-align:center;font-size:13px;margin-bottom:28px}
.form-group{margin-bottom:18px}
label{color:#64748b;display:block;margin-bottom:6px;font-size:13px;font-weight:500}
input{width:100%;padding:12px 16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;color:#334155;font-size:15px;outline:none;transition:all .2s}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12);background:#fff}
input::placeholder{color:#cbd5e1}
.btn{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 2px 4px rgba(59,130,246,.3)}
.btn:hover{background:#2563eb;box-shadow:0 3px 8px rgba(59,130,246,.4)}
.btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
.error{color:#ef4444;font-size:13px;text-align:center;margin-top:14px;display:none}
.error.show{display:block}
.loading{text-align:center;color:#94a3b8;font-size:13px;margin-top:14px;display:none}
.loading.show{display:block}
.footer{text-align:center;color:#cbd5e1;font-size:11px;margin-top:22px}
</style>
</head>
<body>
<div class="card">
<div class="logo"><div class="logo-icon">G</div></div>
<h1>GoRemote</h1>
<p class="subtitle">SSH 隧道管理面板</p>
<div class="form-group">
<label>管理员密码</label>
<input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
</div>
<button class="btn" id="login-btn" onclick="login()">登 录</button>
<div class="error" id="error"></div>
<div class="loading" id="loading">验证中...</div>
<div class="footer">GoRemote &middot; 内网穿透管理</div>
</div>
<script>
async function login(){
const pwd=document.getElementById('password');
const btn=document.getElementById('login-btn');
const err=document.getElementById('error');
const loading=document.getElementById('loading');
err.classList.remove('show');
if(!pwd.value){err.textContent='请输入密码';err.classList.add('show');return}
btn.disabled=true;loading.classList.add('show');
try{
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd.value})});
const d=await r.json();
if(r.ok)window.location.href='/';
else{err.textContent=d.error||'密码错误';err.classList.add('show')}
}catch(e){err.textContent='网络错误';err.classList.add('show')}
finally{btn.disabled=false;loading.classList.remove('show')}
}
</script>
</body>
</html>
