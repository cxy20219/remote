server:
  host: "0.0.0.0"
  port: 8080
  tls:
    enabled: false
    cert: ""
    key: ""

auth:
  key: "test-secret-key"

heartbeat:
  interval: 30
  timeout: 90

log:
  level: "info"
  file: ""

file_transfer:
  upload_path: "/tmp/uploads"
  download_path: "/tmp/downloads"

tunnel:
  enabled: true
  public_host: "YOUR_SERVER"
  default_local_addr: "127.0.0.1"
  port_range_start: 10000
  port_range_end: 20000
  max_tunnels_per_client: 10
