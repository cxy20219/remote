server:
  host: "0.0.0.0"
  port: 8080
  tls:
    enabled: false

auth:
  key: "test-secret-key"

admin:
  password: "admin123"

security:
  # WebSocket origin whitelist (empty = allow all)
  allowed_origins: []
  # Max login attempts per minute per IP
  login_rate_limit: 5
  # Max HTTP request body size in MB
  max_body_size_mb: 10
  # Max connections per minute per IP (anti-scanning, 0 to disable, default 10)
  max_conn_per_min: 10

heartbeat:
  interval: 30
  timeout: 90

log:
  level: "info"

tunnel:
  enabled: true
  public_host: "your-public-host"
  port_range_start: 10000
  port_range_end: 20000
  max_tunnels_per_client: 10
