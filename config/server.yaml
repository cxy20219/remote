server:
  host: "0.0.0.0"
  port: 8080
  tls:
    enabled: false

auth:
  key: "CHANGE-ME-auth-key"

admin:
  password: "CHANGE-ME-admin-password"

security:
  # WebSocket origin whitelist (empty = reject browser Origin; agent requests without Origin are allowed)
  allowed_origins: []
  # Max login attempts per minute per IP
  login_rate_limit: 5
  # Max HTTP request body size in MB (default 10; 0 disables the limit)
  max_body_size_mb: 10
  # Max connections per minute per IP (anti-scanning, 0 to disable, default 10)
  max_conn_per_min: 10
  # Global IP whitelist, bypass all rate limits (supports CIDR)
  global_whitelist: []
  # Cumulative rate-limit violations before auto-blacklist (0 to disable, default 100)
  blacklist_threshold: 100

heartbeat:
  interval: 30
  timeout: 90

log:
  level: "info"
  max_size_mb: 50
  max_backups: 5

tunnel:
  enabled: true
  public_host: "your-public-host"
  port_range_start: 10000
  port_range_end: 20000
  max_tunnels_per_client: 10
