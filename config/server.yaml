server:
  host: "0.0.0.0"
  port: 8080
  tls:
    enabled: false

auth:
  key: "test-secret-key"

admin:
  password: "admin123"

heartbeat:
  interval: 30
  timeout: 90

log:
  level: "info"

tunnel:
  enabled: true
  public_host: "your-public-host"
  port_range_start: 10000
  port_range_end: 20000
  max_tunnels_per_client: 10
