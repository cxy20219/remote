# GoRemote 服务端完整配置示例（生产环境）
# 复制为 server.yaml 并按需修改

server:
  host: "0.0.0.0"        # 监听地址，0.0.0.0 表示所有网卡
  port: 8080              # 监听端口
  tls:
    enabled: true         # 生产环境务必启用 TLS
    cert: "/path/to/server.crt"
    key: "/path/to/server.key"

auth:
  key: "your-secret-key-change-me"   # Agent 注册密钥（必改）

admin:
  password: "your-admin-password"    # Web 管理界面密码（必改）

security:
  allowed_origins:                   # WebSocket Origin 白名单；空配置拒绝浏览器 Origin
    - "https://your-domain.com"
  login_rate_limit: 5                # 登录速率限制（次/分/IP），0=禁用
  max_body_size_mb: 10               # 请求体最大大小（MB），默认 10，0=禁用限制

heartbeat:
  interval: 30           # 心跳检测间隔（秒）
  timeout: 90            # 心跳超时（秒），超时后断开 Agent

log:
  level: "info"          # 日志级别：debug / info / warn / error
  # file: "/var/log/goremote/server.log"  # 日志文件路径（空=stdout）

tunnel:
  enabled: true
  public_host: "your-domain.com"     # API 返回的公网地址
  default_local_addr: "127.0.0.1"    # 默认内网目标地址
  port_range_start: 10000            # 端口池起始
  port_range_end: 20000              # 端口池结束
  max_tunnels_per_client: 10         # 每 Agent 最大隧道数

swagger:
  enabled: false         # 生产环境建议关闭 Swagger UI
