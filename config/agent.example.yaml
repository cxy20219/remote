# GoRemote Agent 完整配置示例（生产环境）
# 复制为 agent.yaml 并按需修改

server:
  address: "your-server:8080"        # 服务端地址（必改）
  tls:
    enabled: true                    # 与服务端 TLS 配置一致
    ca: "server.crt"                 # CA 证书路径（验证服务端）
    # insecure_skip_verify: true     # 跳过证书验证（仅测试用）

auth:
  key: "your-secret-key-change-me"   # 预共享密钥（必改，需与服务端一致）

agent:
  hostname: ""                       # 主机名（空=自动检测）
  os: ""                             # 操作系统（空=自动检测）

heartbeat:
  interval: 30           # 心跳间隔（秒）

reconnect:
  interval: 5            # 初始重连间隔（秒）
  max_attempts: 0        # 最大重试次数（0=无限）
  max_interval: 60       # 最大重连间隔（秒，指数退避上限）

log:
  level: "info"          # 日志级别：debug / info / warn / error
  # file: "/var/log/goremote/agent.log"  # 日志文件路径（空=stdout）

tunnel:
  enabled: true          # 是否启用隧道功能
