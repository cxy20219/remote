server:
  address: "your-server:8080"
  tls:
    enabled: true
    ca: "server.crt"

auth:
  key: "test-secret-key"

agent:
  hostname: "internal-server"
  os: "linux"

heartbeat:
  interval: 30

reconnect:
  interval: 5
  max_interval: 60

log:
  level: "info"
  interval: 5
  max_attempts: 0
  max_interval: 60

log:
  level: "info"
  file: ""
