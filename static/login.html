<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoRemote - 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 48px; max-width: 400px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
h1 { color: #fff; font-size: 24px; text-align: center; margin-bottom: 8px; }
.subtitle { color: rgba(255,255,255,0.5); text-align: center; font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
label { color: rgba(255,255,255,0.7); display: block; margin-bottom: 8px; font-size: 14px; }
input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: all 0.2s; }
input:focus { border-color: #6366f1; background: rgba(255,255,255,0.12); }
input::placeholder { color: rgba(255,255,255,0.3); }
.btn { width: 100%; padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn:hover { background: #4f46e5; transform: translateY(-1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.error { color: #f87171; font-size: 13px; text-align: center; margin-top: 16px; display: none; }
.error.show { display: block; }
.loading { text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 16px; display: none; }
.loading.show { display: block; }
.footer { text-align: center; color: rgba(255,255,255,0.2); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
<h1>🔐 GoRemote</h1>
<p class="subtitle">SSH 隧道管理面板</p>
<div class="form-group">
<label>管理员密码</label>
<input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
</div>
<button class="btn" id="login-btn" onclick="login()">登录</button>
<div class="error" id="error">密码错误</div>
<div class="loading" id="loading">验证中...</div>
<div class="footer">GoRemote · 内网穿透管理</div>
</div>
<script>
async function login() {
const pwd = document.getElementById('password');
const btn = document.getElementById('login-btn');
const error = document.getElementById('error');
const loading = document.getElementById('loading');
error.classList.remove('show');
if (!pwd.value) { error.textContent='请输入密码'; error.classList.add('show'); return; }
btn.disabled = true;
loading.classList.add('show');
try {
const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd.value}) });
const data = await res.json();
if (res.ok) { window.location.href = '/'; }
else { error.textContent = data.error || '密码错误'; error.classList.add('show'); }
} catch(e) { error.textContent = '网络错误'; error.classList.add('show'); }
finally { btn.disabled = false; loading.classList.remove('show'); }
}
</script>
</body>
</html>
